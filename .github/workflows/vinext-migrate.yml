name: FaceBai One-Shot Vinext Migration

on:
  push:
    branches:
      - feature/f1-auth-foundation
    paths:
      - .github/workflows/vinext-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/f1-auth-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install current dependencies
        run: npm install --no-audit --no-fund

      - name: Generate non-destructive Cloudflare vinext target
        run: >-
          npx --yes vinext@1.0.0-beta.11 init
          --skip-check
          --platform=cloudflare
          --cdn-cache=workers-cache
          --data-cache=none
          --image-optimization=none
          --no-prerender

      - name: Lock FaceBai development Worker configuration
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'facebai-development';
          config.preview_urls = true;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Verify vinext Workers build
        env:
          NEXT_PUBLIC_SITE_URL: https://dev.facebai.party
          NEXT_PUBLIC_SUPABASE_URL: https://hxrrdwhttmkjluhcverb.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder_for_build_only
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFCdCcxwW8Jx02gI
        run: npm run build:vinext

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .gitignore vite.config.ts wrangler.jsonc
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "build: add Cloudflare vinext development target"
          git push origin HEAD:feature/f1-auth-foundation
